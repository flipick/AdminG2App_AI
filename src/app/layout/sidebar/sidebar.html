<aside class="h-full px-2 py-4">
    <nav class="flex flex-col gap-3 text-sm">
        <!-- Loop through visible navigation items based on role -->
        <a *ngFor="let item of visibleNavigationItems"
           [routerLink]="[item.path]"
           [ngClass]="{ 'bg-blue-100 text-blue-700 font-bold': isItemActive(item) }"
           class="flex items-center gap-2 px-4 py-2 rounded hover:bg-blue-50 transition-colors duration-200">
            {{ item.icon }} {{ item.label }}
        </a>

        <!-- Show message if no items are visible -->
        <div *ngIf="visibleNavigationItems.length === 0" 
             class="px-4 py-6 text-center text-gray-500 text-xs">
            <p>No menu items available</p>
            <p class="mt-1">Contact administrator</p>
        </div>
    </nav>

    <!-- Optional: Show current role (for development/debugging) -->
    <!-- Uncomment below to see current role -->
    <!--
    <div class="mt-auto pt-4 px-4 text-xs text-gray-400 border-t border-gray-200">
        Role: {{ currentUserRole }}
    </div>
    -->
</aside>
